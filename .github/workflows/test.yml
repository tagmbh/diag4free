name: Abnahme (Content + UI)

# Läuft bei jedem Push und PR. Bewusst getrennt vom Pages-Deploy: der
# Browser-Download kann hängen, und ein hängender Test soll das Deployment
# der Wissensbasis nicht blockieren. Rot hier heißt trotzdem: nicht mergen.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  abnahme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Content gegen die Verträge prüfen
        run: node scripts/validate-content.mjs

      - name: Index bauen
        run: node scripts/build-index.mjs

      - name: Index ist aktuell
        # Ein veralteter index.json im Repo heißt: jemand hat Content
        # geändert, aber den Build nicht laufen lassen. Live würde dann
        # etwas anderes stehen als im Repo.
        # `generated` ist ein Zeitstempel und ändert sich bei jedem Build —
        # er wird beim Vergleich ausgeklammert, sonst schlägt der Check immer an.
        run: |
          git show HEAD:content/index.json > "$RUNNER_TEMP/committed.json"
          node -e '
            const fs = require("fs");
            const inhalt = p => { const o = JSON.parse(fs.readFileSync(p, "utf8")); delete o.generated; return JSON.stringify(o); };
            if (inhalt(process.argv[1]) !== inhalt("content/index.json")) {
              console.error("::error::content/index.json ist nicht aktuell — \"node scripts/build-index.mjs\" ausführen und committen");
              process.exit(1);
            }
            console.log("content/index.json ist aktuell");
          ' "$RUNNER_TEMP/committed.json"

      - name: Playwright installieren
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: UI-Abnahme auf Phone, Tablet und Desktop
        run: node tests/run.mjs
