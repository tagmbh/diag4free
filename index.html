<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0071bb" />
  <meta name="description" content="diag4free — Technische Werkstatt-Wissensbasis für ältere BMW: Diagnose, Codierung, Reparatur, Verkabelung. PWA, offlinefähig." />
  <title>diag4free · BMW Werkstatt-Wissensbasis</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap" rel="stylesheet" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous" />

  <link rel="stylesheet" href="./base.css" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./mobile.css" />
  <link rel="stylesheet" href="./symptome.css" />
  <link rel="stylesheet" href="./glossar.css" />
</head>
<body>
  <a href="#main" class="skip-link">Zum Inhalt springen</a>

  <div class="app" id="app">
    <!-- ============== SIDEBAR ============== -->
    <aside class="sidebar" id="sidebar" aria-label="Hauptnavigation">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="16" cy="16" r="13" />
          <path d="M16 3 L16 29 M3 16 L29 16" />
          <path d="M16 3 A13 13 0 0 1 29 16 L16 16 Z" fill="currentColor" opacity="0.35" />
          <path d="M16 29 A13 13 0 0 1 3 16 L16 16 Z" fill="currentColor" opacity="0.35" />
        </svg>
        <div>
          <div class="brand-name">diag4<em>free</em></div>
          <div class="brand-tag">BMW Werkstatt · Wissensbasis</div>
        </div>
      </div>

      <div class="nav-section">Arbeitsbereich</div>
      <ul class="nav-list" role="list">
        <li class="nav-item">
          <button data-view="overview" aria-current="page">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
            Übersicht
          </button>
        </li>
        <li class="nav-item">
          <button data-view="docs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4z"/><path d="M14 4v6h6"/></svg>
            Tech-Docs
          </button>
        </li>
        <li class="nav-item">
          <button data-view="troubleshoot">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            Diagnosepfade
          </button>
        </li>
        <li class="nav-item">
          <button data-view="measure">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Messplan
          </button>
        </li>
        <li class="nav-item">
          <button data-view="library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            Bibliothek
          </button>
        </li>
        <li class="nav-item">
          <button data-view="software">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Software-Updates
          </button>
        </li>
      </ul>

      <div class="nav-section">Baureihen</div>
      <ul class="nav-model-tree" role="list" id="modelTree">
        <!-- populated by JS -->
      </ul>

      <div class="sidebar-footer">
        <span class="status-dot" id="statusDot" aria-hidden="true"></span>
        <span id="statusText">Online · v0.1</span>
      </div>
    </aside>

    <!-- ============== TOPBAR ============== -->
    <header class="topbar" role="banner">
      <button class="topbar-menu-btn" id="menuBtn" aria-label="Menü öffnen" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <!-- Die aktive Auswahl ist die wichtigste Information der ganzen
           Oberflaeche: alles darunter ist auf sie gefiltert. Frueher stand
           sie klein zwischen zwei Beschriftungen und war nicht anklickbar —
           man sah kaum, was gewaehlt war, und kam von hier aus nicht weg.
           Jetzt ist sie das Schild selbst und zugleich der Weg zum Wechseln. -->
      <div class="topbar-context" aria-live="polite">
        <button class="ctx-chip" id="ctxChip" aria-label="Fahrzeug und Motor wechseln">
          <span class="ctx-chip-veh" id="ctxSeries">E46</span>
          <span class="ctx-chip-dot" aria-hidden="true"></span>
          <span class="ctx-chip-eng" id="ctxEngine">M54</span>
          <span class="ctx-chip-hint" aria-hidden="true">wechseln</span>
        </button>
        <button class="vin-btn" id="vinBtn" aria-label="Fahrzeug per VIN identifizieren" title="VIN-Dekodierung">VIN</button>
      </div>

      <div class="topbar-search" id="searchWrap">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="globalSearch" placeholder="Suchen … (ID, Titel, DTC, Modul)" aria-label="Globale Suche" />
        <kbd>⌘K</kbd>
      </div>

      <div class="topbar-actions">
        <button class="install-btn" id="installBtn" aria-label="Als App installieren">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          <span>App installieren</span>
        </button>
        <button class="icon-btn" id="searchMobileBtn" aria-label="Suche" title="Suche (⌘K)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
        <button class="icon-btn" id="printBtn" aria-label="Drucken" title="Drucken">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" data-theme-toggle aria-label="Dark Mode umschalten" title="Dark Mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>

    <!-- ============== MAIN ============== -->
    <main class="main" id="main" tabindex="-1">
      <!-- Overview -->
      <section class="view active" data-view-panel="overview" aria-labelledby="ovTitle">
        <div class="view-inner" id="overviewPanel">
          <!-- Startzustand, bis content/index.json geladen ist. Vorher stand
               hier nichts: ein leerer weisser Bereich, der in der Werkstatt
               ueber eine langsame Verbindung wie eine kaputte App aussieht.
               Die erste Zeichnung ersetzt diesen Block vollstaendig. -->
          <div class="boot" role="status" aria-busy="true" aria-live="polite">
            <p class="boot-text">Wissensbasis wird geladen …</p>
            <div class="boot-bars" aria-hidden="true">
              <span class="boot-bar"></span>
              <span class="boot-bar"></span>
              <span class="boot-bar"></span>
            </div>
          </div>
        </div>
      </section>

      <!-- Docs -->
      <section class="view" data-view-panel="docs" aria-labelledby="docsTitle">
        <div class="view-inner" id="docsPanel"><!-- populated --></div>
      </section>

      <!-- Troubleshoot -->
      <section class="view" data-view-panel="troubleshoot" aria-labelledby="tsTitle">
        <div class="view-inner" id="troubleshootPanel"><!-- populated --></div>
      </section>

      <!-- Measure -->
      <section class="view" data-view-panel="measure" aria-labelledby="msTitle">
        <div class="view-inner" id="measurePanel"><!-- populated --></div>
      </section>

      <!-- Global Library -->
      <section class="view" data-view-panel="library" aria-labelledby="libTitle">
        <div class="view-inner" id="libraryPanel"><!-- populated --></div>
      </section>

      <!-- Software Updates -->
      <section class="view" data-view-panel="software" aria-labelledby="swTitle">
        <div class="view-inner" id="softwarePanel"><!-- populated --></div>
      </section>

      <!-- OBD-Scan: eigene Diagnose, kein fremdes Werkzeug -->
      <section class="view" data-view-panel="scan" aria-labelledby="scanTitle">
        <div class="view-inner" id="scanPanel"><!-- populated --></div>
      </section>
    </main>
  </div>

  <!-- Sidebar-Backdrop: ohne ihn deckt die geöffnete Sidebar den Menü-Button
       zu und die einzige Rückkehr wäre, eine Baureihe anzutippen. -->
  <div class="sidebar-backdrop" data-sidebar-backdrop hidden></div>

  <!-- ============== BOTTOM TABBAR (Touch / Daumenzone) ============== -->
  <nav class="tabbar" id="tabbar" aria-label="Schnellnavigation">
    <button class="tab" data-view="overview">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      <span>Übersicht</span>
    </button>
    <button class="tab" data-view="docs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h11l5 5v11a1 1 0 0 1-1 1H4z"/><path d="M14 4v6h6"/></svg>
      <span>Docs</span>
    </button>
    <button class="tab tab-accent" data-view="troubleshoot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      <span>Diagnose</span>
      <span class="tab-dot" id="tabResumeDot" hidden aria-hidden="true"></span>
    </button>
    <button class="tab" data-view="measure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span>Messplan</span>
    </button>
    <button class="tab" data-view="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      <span>Suchen</span>
    </button>
  </nav>

  <!-- Drawer -->
  <div class="drawer-backdrop" data-drawer-backdrop aria-hidden="true"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-hidden="true" data-doc-drawer>
    <header class="drawer-header">
      <div>
        <div class="drawer-title" id="drawerTitle">—</div>
        <div class="drawer-subtitle" id="drawerSubtitle">—</div>
      </div>
      <button class="close-btn" data-close-drawer aria-label="Schließen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="drawer-body" id="drawerBody"><!-- populated --></div>
    <footer class="drawer-footer" id="drawerFooter"><!-- populated --></footer>
  </aside>

  <!-- Libs (via CDN — vom Service Worker gecacht) -->
  <!-- crossorigin: ohne das Attribut sind die Antworten fuer den Service Worker undurchsichtig (opaque) und landen nie im Vorrat. -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" crossorigin="anonymous"></script>

  <script src="./graphics.js"></script>
  <script src="./md.js"></script>
  <script src="./obd.js"></script>
  <script src="./symptome.js"></script>
  <script src="./glossar.js"></script>
  <script src="./app.js"></script>
</body>
</html>
